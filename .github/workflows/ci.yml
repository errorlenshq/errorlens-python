name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: |
          pip install -e .
          # Frameworks for the integration tests (pip picks versions that support this Python).
          pip install flask fastapi httpx django sqlalchemy celery
      - name: Test
        working-directory: tests
        run: python -m unittest -v test_core test_integrations

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - name: No runtime dependencies
        run: |
          python - <<'PY'
          import zipfile, glob
          meta = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).read(
              [n for n in zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist() if n.endswith("METADATA")][0]).decode()
          deps = [l for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          assert not deps, deps
          print("no dependencies")
          PY
